name: Build Paper PDF

on:
  push:
    branches:
      - main
    paths:
      - 'paper/**'
      - '.github/workflows/build-paper-pdf.yml'
      - 'src/**'
      - 'requirements.txt'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Generate figures
        run: |
          python src/energy_analysis.py --n_days 365 --n_consumers 200
      
      - name: Verify figures exist
        run: |
          ls -la outputs/figures/
          if [ ! -f "outputs/figures/explained_variance.png" ]; then
            echo "Error: explained_variance.png not found"
            exit 1
          fi
      
      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v2
        with:
          root_file: paper/MAIN.tex
          working_directory: .
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode
      
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper-pdf
          path: paper/MAIN.pdf
      
      - name: Commit PDF
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add paper/MAIN.pdf
          git commit -m "Auto update paper PDF" || echo "No changes"
          git push
