name: Build Paper PDF

on:
  push:
    branches:
      - main
    paths:
      - 'paper/**'
      - '.github/workflows/build-paper-pdf.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      
      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v2
        with:
          root_file: paper/MAIN.tex
          working_directory: .
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode
      
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper-pdf
          path: paper/MAIN.pdf
      
      - name: Commit PDF
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add paper/MAIN.pdf
          git commit -m "Auto update paper PDF" || echo "No changes"
          git push
